<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://allapolishchuk-cyber.github.io/betterskin-cursor/">
    <title>BetterSkin - Redirecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h1 {
            color: #b1724c;
            margin-bottom: 20px;
        }
        .link {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: #b1724c;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(177, 114, 76, 0.3);
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #b1724c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BetterSkin</h1>
        <p>Redirecting to your app...</p>
        <div class="spinner"></div>
        <a href="https://allapolishchuk-cyber.github.io/betterskin-cursor/" class="link">
            Click here if not redirected automatically
        </a>
    </div>
    <script>
        // Immediate redirect
        window.location.href = 'https://allapolishchuk-cyber.github.io/betterskin-cursor/';
    </script>
</body>
</html>
